# for more options, see https://docs.rendercv.com/user_guide/yaml_input_structure/design/
design:
  theme: sb2nov
  page:
    size: a4
    show_footer: false
    show_top_note: false
  typography:
    alignment: left
    font_family:
      body: New Computer Modern
      name: New Computer Modern
      headline: New Computer Modern
      connections: New Computer Modern
      section_titles: New Computer Modern
    font_size:
      body: 10pt
      name: 25pt
      section_titles: 1.1em
    bold:
      name: true
      section_titles: true
    small_caps:
      section_titles: true
  colors:
    body: rgb(0,0,0)
    name: rgb(0,0,0)
    connections: rgb(0,0,0)
    headline: rgb(0,0,0)
    section_titles: rgb(0,0,0)
    links: rgb(0,0,0)
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    space_below_name: 0.18cm
    space_below_connections: 0.45cm
    connections:
      show_icons: true
      display_urls_instead_of_usernames: true
      separator: ""
      space_between_connections: 0.18cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.35cm
    space_below: 0.18cm
  sections:
    space_between_regular_entries: 0.34cm
    space_between_text_based_entries: 0.12cm
    show_time_spans_in: []
  entries:
    side_space: 0cm
    short_second_row: false
    highlights:
      bullet: "•"
      nested_bullet: "◦"
      space_left: 0.18cm
      space_above: 0.05cm
      space_between_items: 0.04cm
  templates:
    education_entry:
      main_column: "**INSTITUTION**\n*DEGREE* *in* *AREA*\nSUMMARY\nHIGHLIGHTS"
      degree_column: null
      date_and_location_column: "DATE"
    experience_entry:
      main_column: "**POSITION**\nCOMPANY\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "DATE\nLOCATION"
    normal_entry:
      main_column: "**NAME**\nAWARDER\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "DATE\nLOCATION"
    publication_entry:
      main_column: "**TITLE**\nAUTHORS\nJOURNAL"
