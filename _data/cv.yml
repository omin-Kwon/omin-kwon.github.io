    Research Experience:
      - company: Seoul National University
        position: Graduate Student Researcher
        location: Seoul, South Korea
        start_date: 2025-09
        end_date: present
        highlights:
          - "Research visit to FAST Lab, UIUC (Mar-May 2026)."
          - >-
            **MAGE (Project Lead)** · Advisor: Prof. Jae W. Lee
            - Designed a training-free **sparse attention algorithm** for block diffusion LLMs.
            - Developed an **inference system** integrated into SGLang with optimized CUDA kernels.
            - Achieved up to 6.82× end-to-end speedup at 128K context with near-lossless accuracy.
          - >-
            **HERALD (Project Lead)** · Advisor: Prof. Jae W. Lee
            - Designed a training-free **sparse attention algorithm** for block diffusion LLMs with KV offload.
            - Developed an **inference system** integrated into SGLang with a dual-stream CPU-GPU pipeline.
            - Achieved up to 2.28× decode throughput over GPU-only serving with near-lossless accuracy.
          - >-
            **SketchSSM (Project Lead)** · Advisors: Prof. Jae W. Lee and Prof. Sehoon Kim
            - Designed a training-free **linear attention algorithm** that reduces state-read I/O.
            - Developed an **inference system** integrated into vLLM with optimized CUDA kernels.
            - Achieved up to 2.77× decode throughput over Standard vLLM with near-lossless accuracy.

      - company: Seoul National University
        position: Undergraduate Student Researcher
        location: Seoul, South Korea
        start_date: 2024-09
        end_date: 2025-08
        highlights:
          - >-
            **NestedFP** · Advisor: Prof. Jae W. Lee
            - Integrated the NestedFP CUDA kernel into vLLM with a workload-aware precision-switching scheduler.
          - >-
            **AiDE** · Advisor: Prof. Jae W. Lee
            - Proposed workload-aware KV cache placement for CXL-PNM and developed an LLM simulator.
          - >-
            **STAR (Project Lead)** · Advisor: Prof. Jihong Kim
            - Proposed a 3D NAND randomization algorithm that extends SSD lifetime by up to 2.3×.
            - Designed STAR hardware and integrated it into the SSD controller.
            - Key contributor to a U.S. patent application with SK hynix on STAR.

